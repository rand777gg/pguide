<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      /* 首屏 loading 遮罩：等 JS 加载完再移除，避免白屏。
         沿用老工程 public/index.html 里的方块旋转动画。 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-image: linear-gradient(#f5fcf4, #ffffff);
        z-index: 9999;
      }
      #app-loading .dot {
        width: 16px;
        height: 16px;
        background: #409eff;
        animation: app-loading-rotate 1.2s infinite ease-in-out;
      }
      #app-loading .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      #app-loading .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      #app-loading .dot:nth-child(4) {
        animation-delay: 0.45s;
      }
      @keyframes app-loading-rotate {
        0%,
        70%,
        100% {
          transform: scale3D(1, 1, 1);
        }
        35% {
          transform: scale3D(0, 0, 1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
